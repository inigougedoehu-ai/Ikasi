<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="Planificador de estudio personal para el Máster en Ingeniería Industrial.">
  <title>Ikasi · Plan de estudio</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css?v=10">
</head>
<body>
  <section id="loadingGate" class="auth-gate">
    <div class="auth-card auth-loading-card">
      <div class="auth-mark">K</div>
      <div class="eyebrow">IKASI</div>
      <h1>Cargando Ikasi</h1>
      <p id="loadingStatus" class="muted">Comprobando acceso…</p>
      <div class="loading-spinner" aria-hidden="true"></div>
    </div>
  </section>

  <section id="authGate" class="auth-gate" hidden>
    <div class="auth-card">
      <div class="auth-mark">K</div>
      <div class="eyebrow">IKASI</div>
      <h1>Acceso protegido</h1>
      <p class="muted">Introduce la clave para abrir el plan de estudio.</p>
      <form id="authForm">
        <label>Clave
          <input id="authKey" type="password" autocomplete="current-password" required>
        </label>
        <button class="btn primary auth-submit" type="submit">Entrar</button>
        <div id="authError" class="auth-error" role="alert" aria-live="polite"></div>
      </form>
    </div>
  </section>

  <div class="app-shell" id="appShell" hidden>
    <header class="topbar">
      <div>
        <div class="brand">IKASI</div>
        <div class="subtitle">Plan de estudio · Bimestre 1</div>
      </div>
      <div class="top-actions">
        <button id="themeToggle" class="icon-btn" aria-label="Cambiar tema">◐</button>
      </div>
    </header>

    <nav class="tabs" aria-label="Navegación principal">
      <button class="tab active" data-view="today">Hoy</button>
      <button class="tab" data-view="calendar">Calendario</button>
      <button class="tab" data-view="progress">Progreso</button>
      <button class="tab" data-view="admin">Admin</button>
    </nav>

    <main>
      <section id="view-today" class="view active"></section>
      <section id="view-calendar" class="view"></section>
      <section id="view-progress" class="view"></section>
      <section id="view-admin" class="view"></section>
    </main>
  </div>

  <dialog id="timeDialog" class="time-dialog">
    <form method="dialog" id="timeForm">
      <div class="dialog-head">
        <div>
          <div class="eyebrow">TIEMPO REAL</div>
          <h2 id="timeDialogTitle">Registrar sesión</h2>
          <div id="timeDialogPlanned" class="muted"></div>
        </div>
        <button class="icon-btn" value="cancel" aria-label="Cerrar">✕</button>
      </div>

      <div class="time-value" id="timeValue">0 min</div>
      <input id="timeRange" class="time-range" type="range" min="0" max="240" step="15" value="0" aria-label="Minutos reales">

      <div class="time-stepper">
        <button type="button" class="btn" data-time-delta="-15">−15 min</button>
        <button type="button" class="btn" data-time-delta="15">+15 min</button>
      </div>

      <div class="time-quick" aria-label="Valores rápidos">
        <button type="button" class="btn ghost" data-time-quick="30">30 min</button>
        <button type="button" class="btn ghost" data-time-quick="60">1 h</button>
        <button type="button" class="btn ghost" data-time-quick="90">1 h 30</button>
        <button type="button" class="btn ghost" data-time-quick="120">2 h</button>
        <button type="button" class="btn ghost" data-time-quick="planned">= previsto</button>
      </div>

      <label class="completion-row">
        <input id="timeCompleted" type="checkbox">
        <span>Sesión completada</span>
      </label>

      <div class="dialog-actions">
        <button type="button" class="btn ghost" id="clearTimeBtn">Poner a 0</button>
        <div class="spacer"></div>
        <button class="btn ghost" value="cancel">Cancelar</button>
        <button type="button" class="btn primary" id="saveTimeBtn">Guardar</button>
      </div>
    </form>
  </dialog>

  <script src="config.js?v=10"></script>
  <script src="data.js?v=10"></script>
  <script src="app.js?v=10"></script>
</body>
</html>
